name: CodeBoxx Web Claude - Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by a Sanity webhook (project zagi8xr3, "production" dataset) on every
  # publish — this is a static build, so a content change alone never reaches
  # the live site without a rebuild. See readme.md's Deployment section for the
  # webhook config (URL, headers, GROQ projection) this expects to receive.
  repository_dispatch:
    types: [sanity-publish]

# One deploy at a time: a publish or push during a deploy waits, and GitHub keeps only the
# newest waiting run, so an older build can never finish last and overwrite newer content.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The relay's own dependency (the Anthropic SDK, for Codi): installed here and rsynced to the
      # droplet with relay/, so the droplet never runs npm.
      - name: Install relay dependencies
        run: npm ci --omit=dev --prefix relay

      # ops/ is installed on the droplet by hand (ops/nginx-report/README.md), never deployed.
      - name: Test src/lib, the relay and ops/
        run: |
          npm run test:lib
          npm run test:relay
          npm run test:ops

      - name: Build
        run: npm run build
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}
          VITE_SANITY_API_VERSION: ${{ secrets.VITE_SANITY_API_VERSION }}
          VITE_SANITY_TOKEN: ${{ secrets.VITE_SANITY_TOKEN }}
          # Same project/dataset, under the prefix Astro actually exposes to
          # browser-bundled code — see the comment atop src/lib/sanity.js.
          # No PUBLIC_SANITY_TOKEN: never ship a write-capable token client-side.
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}
          PUBLIC_SANITY_API_VERSION: ${{ secrets.VITE_SANITY_API_VERSION }}

      - name: Add deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Deploy dist/ to Droplet
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz --delete dist/ "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:${{ secrets.DROPLET_TARGET_PATH }}"

      # relay/ runs on the droplet as the website-relay service (setup: relay/README.md). Every
      # Sanity publish runs this job too, so the service restarts only when rsync changed a file
      # (compared by checksum: checkout mtimes always differ).
      - name: Deploy relay/ to Droplet
        run: |
          target="${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}"
          changes=$(rsync -rlz --checksum --delete --itemize-changes --exclude test/ relay/ "$target:/opt/website-relay/")
          if [ -z "$changes" ]; then
            echo "relay/ unchanged: no restart"
            exit 0
          fi
          echo "$changes"
          ssh "$target" 'sudo systemctl restart website-relay &&
            for i in 1 2 3 4 5; do sleep 1; curl -fsS http://127.0.0.1:8787/api/health && exit 0; done; exit 1'
