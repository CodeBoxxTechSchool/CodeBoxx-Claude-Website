# codeboxx.ai over HTTPS, with a Cloudflare Origin Certificate (Cloudflare SSL mode: Full strict).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codeboxx.ai www.codeboxx.ai;
    ssl_certificate     /etc/ssl/cloudflare/codeboxx.ai.pem;
    ssl_certificate_key /etc/ssl/cloudflare/codeboxx.ai.key;
    include snippets/codeboxx-tls.conf;
    include snippets/codeboxx-site.conf;
}
