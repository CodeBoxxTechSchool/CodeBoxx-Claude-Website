# Plain http on codeboxx.com -> https://codeboxx.ai, in one hop; certificate challenges stay on
# http. The redirects include already sends every apex path there; this only backs it up.
# A map, since a server-level return runs before any location is matched.
map "$host:$uri" $codeboxx_https {
    default "";
    "~^codeboxx\.com:/\.well-known/acme-challenge(/|$)" "";
    "~^codeboxx\.com:" https://codeboxx.ai$request_uri;
}

# Port 80: every host. HTTPS is codeboxx-https.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Old Wix hosts and paths, and the whole apex -> https://codeboxx.ai (ops/nginx/README.md).
    include snippets/codeboxx-redirects.conf;

    if ($codeboxx_https) {
        return 301 $codeboxx_https;
    }

    # Let's Encrypt HTTP-01, outside the site root the deploy rsyncs with --delete.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # The IP and unknown hosts get the site, as before (uptime checks use the IP).
    include snippets/codeboxx-site.conf;
}
