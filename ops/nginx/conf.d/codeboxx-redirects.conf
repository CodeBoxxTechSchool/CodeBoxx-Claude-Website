# Keys such as "academie:/post/<long slug>" outgrow the default bucket.
map_hash_bucket_size 256;

map $host $legacy_group {
    default "";
    codeboxx.com apex;
    www.codeboxx.com www;
    academy.codeboxx.com academy;
    www.academy.codeboxx.com academy;
    academie.codeboxx.com academie;
    www.academie.codeboxx.com academie;
    solutions.codeboxx.com solutions;
    www.solutions.codeboxx.com solutions;
}

# Without its trailing slashes, so /contact and /contact/ match alike.
map $uri $legacy_path {
    default $uri;
    "~^(.+?)/+$" $1;
}

