# The site itself; included last in the codeboxx server blocks (port 80 and 443).
root /var/www/codeboxx;
index index.html;

error_page 404 /404.html;

# Website relay (/opt/website-relay, service website-relay): site forms -> portal.
location /api/ {
    limit_req zone=forms burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}

# Careers form: an 8 MB body for the CV, kept in memory so no copy lands on disk.
location = /api/careers {
    limit_req zone=forms burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 8m;
    client_body_buffer_size 8m;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}

# Uptime checks, not rate-limited.
location = /api/health {
    proxy_pass http://127.0.0.1:8787;
}

location / {
    try_files $uri $uri/index.html $uri/ =404;
}
