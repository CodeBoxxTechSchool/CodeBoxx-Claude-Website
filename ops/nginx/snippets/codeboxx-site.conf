# The site itself; included last in the codeboxx server blocks (port 80 and 443).
root /var/www/codeboxx;
index index.html;

error_page 404 /404.html;

# Compression: nginx's default gzip_types is text/html only, so the CSS and JS went out
# uncompressed (the CSS at 274 KB instead of 40 KB, render-blocking on mobile).
# Images, video and woff2 are compressed already.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/css text/javascript application/javascript application/json
    application/manifest+json application/xml application/rss+xml image/svg+xml text/plain;

# Astro's build output: the file name carries a content hash, so it never changes. ^~ so the
# image rule below doesn't take its SVGs.
location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Images, video and fonts under public/ keep their name across deploys: a day, then
# the browser revalidates (ETag / Last-Modified).
location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|mp4|webm|woff2?)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
}

# Website relay (/opt/website-relay, service website-relay): site forms -> portal.
location /api/ {
    limit_req zone=forms burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}

# Careers form: an 8 MB body for the CV, kept in memory so no copy lands on disk.
location = /api/careers {
    limit_req zone=forms burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 8m;
    client_body_buffer_size 8m;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}

# Uptime checks, not rate-limited.
location = /api/health {
    proxy_pass http://127.0.0.1:8787;
}

# Pages and the rest: always revalidated, so a deploy shows at once and no page asks for
# /_astro/ files the deploy's rsync --delete removed.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html $uri/ =404;
}
