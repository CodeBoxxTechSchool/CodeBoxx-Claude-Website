# Mozilla "intermediate" (TLS 1.2 and 1.3); included in both 443 server blocks, since the
# protocols are picked with the default server, before SNI. No OCSP: Let's Encrypt ended it.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:codeboxx_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
