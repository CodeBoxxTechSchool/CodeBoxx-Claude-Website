# Port 443 (/etc/nginx/sites-available/codeboxx-https): install once the certificate exists,
# nginx won't load without it. Port 80 and the shared snippets are codeboxx.conf.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codeboxx.com www.codeboxx.com academy.codeboxx.com www.academy.codeboxx.com
        academie.codeboxx.com www.academie.codeboxx.com solutions.codeboxx.com
        www.solutions.codeboxx.com;

    # One certificate for the eight names (certbot --cert-name codeboxx.com).
    ssl_certificate /etc/letsencrypt/live/codeboxx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeboxx.com/privkey.pem;
    include snippets/codeboxx-tls.conf;

    include snippets/codeboxx-redirects.conf;
    include snippets/codeboxx-site.conf;
}

# The IP and unknown names: fail the handshake rather than show our certificate.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    include snippets/codeboxx-tls.conf;
}
